<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curls by Carine | Availability</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Poppins', sans-serif; background-color: #fdfaf5; margin: 0; padding: 0; display: flex; justify-content: center; }
    .header-black { background-color: #000; padding: 20px 0; text-align: center; width: 100%; border-bottom: 3px solid #b39359; }
    .header-black img { width: 100px; height: auto; }
    .main-wrapper { width: 95%; max-width: 450px; background: white; margin: 15px; border: 1px solid #e0d0b0; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .content-padding { padding: 15px; }

    .week-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
    .week-btn { flex: 1; padding: 12px; border: 1px solid #e0d0b0; background: #fff; color: #777; font-size: 11px; font-weight: 700; cursor: pointer; border-radius: 8px; text-transform: uppercase; transition: 0.3s; }
    .week-btn.active { background: #b39359; color: #fff; border-color: #b39359; }

    .week-content { display: none; animation: fadeIn 0.4s; }
    .week-content.active { display: block; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .day-container { margin-bottom: 25px; }
    .day-header { font-size: 13px; font-weight: 700; color: #000; background: #fdf7eb; padding: 8px 12px; border-left: 4px solid #b39359; margin-bottom: 10px; border-radius: 4px; display: flex; justify-content: space-between; }
    
    .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
    .slot { padding: 8px 2px; text-align: center; border: 1px solid #f1ece2; border-radius: 6px; font-size: 10px; color: #333; background: #fff; cursor: pointer; transition: 0.2s; }
    
    /* المواعيد المتاحة */
    .slot.available { color: #b39359; font-weight: 600; border-color: #e0d0b0; }
    .slot.available:hover { background: #fff9ef; border-color: #b39359; }

    /* المواعيد المحجوزة */
    .slot.booked { background: #f2f2f2 !important; color: #ccc !important; text-decoration: line-through !important; border-color: #eee !important; cursor: not-allowed; }

    .footer-note { text-align: center; font-size: 10px; color: #777; font-style: italic; margin-top: 20px; border-top: 1px dashed #e0d0b0; padding-top: 15px; }
    .nav-button { display: block; text-align: center; margin-top: 15px; padding: 12px; background-color: #000; color: #b39359; text-decoration: none; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid #b39359; }
</style>
</head>
<body>
<div class="main-wrapper">
    <div class="header-black"><img src="Curls_by_Carine_Logo_Transparent.png" alt="Logo"></div>
    
    <div class="content-padding">
        <div class="week-toggle">
            <button class="week-btn active" onclick="showWeek('this-week', this)">This Week</button>
            <button class="week-btn" onclick="showWeek('next-week', this)">Next Week</button>
        </div>

        <div id="this-week" class="week-content active">
            <!-- الأيام ستظهر هنا تلقائياً -->
        </div>

        <div id="next-week" class="week-content">
            <!-- أيام الأسبوع القادم ستظهر هنا -->
        </div>

        <div class="footer-note">
            * Tap a slot to temporarily mark as booked (Demo).<br>
            * Dates update automatically; past days are removed.
        </div>
        <a href="index.html" class="nav-button">⬅ Back to Home</a>
    </div>
</div>

<script>
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const timeSlots = [
        "09:00 AM", "09:30 AM", "10:00 AM", "10:30 AM", "11:00 AM", "11:30 AM",
        "12:00 PM", "12:30 PM", "01:00 PM", "01:30 PM", "02:00 PM", "02:30 PM",
        "03:00 PM", "03:30 PM", "04:00 PM", "04:30 PM", "05:00 PM", "05:30 PM",
        "06:00 PM", "06:30 PM", "07:00 PM", "07:30 PM", "08:00 PM", "08:30 PM",
        "09:00 PM", "09:30 PM"
    ];

    function generateSchedule() {
        const thisWeekDiv = document.getElementById('this-week');
        const nextWeekDiv = document.getElementById('next-week');
        const today = new Date();
        today.setHours(0,0,0,0);

        for (let i = 0; i < 14; i++) {
            let currentTarget = new Date();
            currentTarget.setDate(today.getDate() + i);
            
            const dayName = days[currentTarget.getDay()];
            const dateString = currentTarget.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            
            const daySection = document.createElement('div');
            daySection.className = 'day-container';
            daySection.innerHTML = `
                <div class="day-header">${dayName} <span>${dateString}</span></div>
                <div class="slots-grid">
                    ${timeSlots.map(time => `<div class="slot available" onclick="toggleBooked(this)">${time}</div>`).join('')}
                </div>
            `;

            // توزيع الأيام: أول 7 أيام في "This Week"، والباقي في "Next Week"
            if (i < 7) {
                thisWeekDiv.appendChild(daySection);
            } else {
                nextWeekDiv.appendChild(daySection);
            }
        }
    }

    function toggleBooked(element) {
        element.classList.toggle('booked');
    }

    function showWeek(weekId, btn) {
        document.querySelectorAll('.week-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(weekId).classList.add('active');
        btn.classList.add('active');
    }

    // تشغيل الدالة عند تحميل الصفحة
    window.onload = generateSchedule;
</script>
</body>
</html>
