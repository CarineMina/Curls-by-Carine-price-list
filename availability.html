<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curls by Carine | Availability</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Poppins', sans-serif; background-color: #fdfaf5; margin: 0; padding: 0; display: flex; justify-content: center; }
    .header-black { background-color: #000; padding: 12px 0; text-align: center; width: 100%; border-bottom: 2px solid #b39359; }
    .header-black img { width: 80px; height: auto; }
    
    .main-wrapper { width: 98%; max-width: 380px; background: white; margin: 10px; border: 1px solid #e0d0b0; border-radius: 12px; overflow: hidden; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
    .content-padding { padding: 10px; }

    .week-toggle { display: flex; gap: 6px; margin-bottom: 12px; }
    .week-btn { flex: 1; padding: 8px; border: 1px solid #e0d0b0; background: #fff; color: #777; font-size: 10px; font-weight: 700; cursor: pointer; border-radius: 6px; text-transform: uppercase; }
    .week-btn.active { background: #b39359; color: #fff; border-color: #b39359; }

    .week-content { display: none; }
    .week-content.active { display: block; }

    .day-container { margin-bottom: 15px; }
    .day-header { font-size: 11px; font-weight: 700; color: #000; background: #fdf7eb; padding: 5px 10px; border-left: 3px solid #b39359; margin-bottom: 6px; border-radius: 3px; display: flex; justify-content: space-between; }
    
    .slots-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
    .slot { padding: 5px 0; text-align: center; border: 1px solid #f1ece2; border-radius: 4px; font-size: 8.5px; color: #333; background: #fff; cursor: pointer; }
    
    .slot.available { color: #b39359; font-weight: 600; border-color: #e0d0b0; }
    .slot.booked { background: #f2f2f2 !important; color: #ccc !important; text-decoration: line-through !important; border-color: #eee !important; }

    .footer-note { text-align: center; font-size: 9px; color: #999; font-style: italic; margin-top: 12px; border-top: 1px dashed #e0d0b0; padding-top: 8px; line-height: 1.2; }
    .nav-button { display: block; text-align: center; margin-top: 10px; padding: 10px; background-color: #000; color: #b39359; text-decoration: none; border-radius: 6px; font-size: 11px; font-weight: 600; border: 1px solid #b39359; }
</style>
</head>
<body>
<div class="main-wrapper">
    <div class="header-black"><img src="Curls_by_Carine_Logo_Transparent.png" alt="Logo"></div>
    
    <div class="content-padding">
        <div class="week-toggle">
            <button class="week-btn active" onclick="showWeek('this-week', this)">Fri - Thu (Current)</button>
            <button class="week-btn" onclick="showWeek('next-week', this)">Fri - Thu (Next)</button>
        </div>

        <div id="this-week" class="week-content active"></div>
        <div id="next-week" class="week-content"></div>

        <div class="footer-note">* Tap to mark booked. Past days are hidden.</div>
        <a href="index.html" class="nav-button">⬅ Back to Services</a>
    </div>
</div>

<script>
    const days = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
    const timeSlots = [
        "09:00 AM", "09:30 AM", "10:00 AM", "10:30 AM", "11:00 AM", "11:30 AM",
        "12:00 PM", "12:30 PM", "01:00 PM", "01:30 PM", "02:00 PM", "02:30 PM",
        "03:00 PM", "03:30 PM", "04:00 PM", "04:30 PM", "05:00 PM", "05:30 PM",
        "06:00 PM", "06:30 PM", "07:00 PM", "07:30 PM", "08:00 PM", "08:30 PM",
        "09:00 PM", "09:30 PM"
    ];

    function generateSchedule() {
        const thisWeekDiv = document.getElementById('this-week');
        const nextWeekDiv = document.getElementById('next-week');
        
        let today = new Date();
        today.setHours(0,0,0,0);

        // العثور على آخر يوم جمعة مضى (أو اليوم إذا كان الجمعة) لبدء الأسبوع الحالي منه
        let startOfThisWeek = new Date(today);
        let diff = (startOfThisWeek.getDay() <= 5) ? (startOfThisWeek.getDay() + 2) : (startOfThisWeek.getDay() - 5);
        startOfThisWeek.setDate(startOfThisWeek.getDate() - diff);
        if(today.getDay() === 5) startOfThisWeek = new Date(today);
        if(today.getDay() === 6) { startOfThisWeek = new Date(today); startOfThisWeek.setDate(today.getDate()-1); }

        // توليد 14 يوم بدءاً من الجمعة
        for (let i = 0; i < 14; i++) {
            let currentTarget = new Date(startOfThisWeek);
            currentTarget.setDate(startOfThisWeek.getDate() + i);
            
            // تخطي الأيام التي مضت فعلياً قبل تاريخ اليوم
            if (currentTarget < today) continue;

            const dayName = days[currentTarget.getDay()];
            const dateString = currentTarget.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            
            const daySection = document.createElement('div');
            daySection.className = 'day-container';
            daySection.innerHTML = `
                <div class="day-header">${dayName} <span>${dateString}</span></div>
                <div class="slots-grid">
                    ${timeSlots.map(time => `<div class="slot available" onclick="toggleBooked(this)">${time.replace(' AM','A').replace(' PM','P')}</div>`).join('')}
                </div>
            `;

            // تقسيم الأيام بناءً على تاريخ الجمعة القادم
            if (i < 7) {
                thisWeekDiv.appendChild(daySection);
            } else {
                nextWeekDiv.appendChild(daySection);
            }
        }
    }

    function toggleBooked(element) {
        element.classList.toggle('booked');
    }

    function showWeek(weekId, btn) {
        document.querySelectorAll('.week-content').forEach(c => c.classList.remove('active'));
        document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
        document.getElementById(weekId).classList.add('active');
        btn.classList.add('active');
    }

    window.onload = generateSchedule;
</script>
</body>
</html>
