<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curls by Carine | Availability</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Poppins', sans-serif; background-color: #fdfaf5; margin: 0; padding: 0; display: flex; justify-content: center; }
    .header-black { background-color: #000; padding: 20px 0; text-align: center; width: 100%; border-bottom: 3px solid #b39359; }
    .header-black img { width: 100px; height: auto; }
    .main-wrapper { width: 95%; max-width: 400px; background: white; margin: 15px; border: 1px solid #e0d0b0; border-radius: 15px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    .content-padding { padding: 15px; }

    .week-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
    .week-btn { flex: 1; padding: 10px; border: 1px solid #e0d0b0; background: #fff; color: #777; font-size: 11px; font-weight: 700; cursor: pointer; border-radius: 8px; text-transform: uppercase; }
    .week-btn.active { background: #b39359; color: #fff; border-color: #b39359; }

    /* إخفاء الأسبوع غير النشط */
    .week-content { display: none; }
    .week-content.active { display: block; }

    .day-header { font-size: 13px; font-weight: 700; color: #000; background: #fdf7eb; padding: 6px 12px; border-left: 4px solid #b39359; margin: 15px 0 8px 0; border-radius: 4px; }
    
    .slots-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; }
    .slot { padding: 6px 2px; text-align: center; border: 1px solid #f1ece2; border-radius: 5px; font-size: 10px; color: #333; background: #fff; }
    .slot.booked { background: #f2f2f2; color: #ccc; text-decoration: line-through; border-color: #eee; }
    .slot.available { color: #b39359; font-weight: 600; border-color: #e0d0b0; }

    .footer-note { text-align: center; font-size: 10px; color: #777; font-style: italic; margin-top: 15px; border-top: 1px dashed #e0d0b0; padding-top: 10px; }
    .nav-button { display: block; text-align: center; margin-top: 10px; padding: 10px; background-color: #000; color: #b39359; text-decoration: none; border-radius: 8px; font-size: 12px; font-weight: 600; border: 1px solid #b39359; }
</style>
</head>
<body>
<div class="main-wrapper">
    <div class="header-black"><img src="Curls_by_Carine_Logo_Transparent.png" alt="Logo"></div>
    
    <div class="content-padding">
        <div class="week-toggle">
            <button class="week-btn active" onclick="showWeek('this-week', this)">This Week</button>
            <button class="week-btn" onclick="showWeek('next-week', this)">Next Week</button>
        </div>

        <!-- محتوى الأسبوع الحالي -->
        <div id="this-week" class="week-content active">
            <div class="day-header">Monday - May 4</div>
            <div class="slots-grid">
                <div class="slot available">09:00 AM</div>
                <div class="slot available">09:30 AM</div>
                <div class="slot booked">10:00 AM</div>
                <div class="slot available">10:30 AM</div>
                <!-- تقدري تكرري المواعيد هنا -->
            </div>
            <div class="day-header">Tuesday - May 5</div>
            <div class="slots-grid">
                <div class="slot available">09:00 AM</div>
                <div class="slot booked">09:30 AM</div>
            </div>
        </div>

        <!-- محتوى الأسبوع القادم -->
        <div id="next-week" class="week-content">
            <div class="day-header">Monday - May 11</div>
            <div class="slots-grid">
                <div class="slot available">09:00 AM</div>
                <div class="slot available">09:30 AM</div>
                <div class="slot available">10:00 AM</div>
            </div>
        </div>

        <div class="footer-note">* Updates every 24 hours.</div>
        <a href="index.html" class="nav-button">⬅ Back to Price List</a>
    </div>
</div>

<script>
    function showWeek(weekId, btn) {
        // إخفاء كل المحتوى
        document.querySelectorAll('.week-content').forEach(content => content.classList.remove('active'));
        // إزالة اللون من كل الأزرار
        document.querySelectorAll('.week-btn').forEach(b => b.classList.remove('active'));
        
        // إظهار المحتوى المختار
        document.getElementById(weekId).classList.add('active');
        // تلوين الزر المختار
        btn.classList.add('active');
    }
</script>

</body>
</html>
