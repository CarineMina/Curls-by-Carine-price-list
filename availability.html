<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Curls by Carine | Availability</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
    body { font-family: 'Poppins', sans-serif; background-color: #fdfaf5; margin: 0; padding: 0; display: flex; justify-content: center; }
    .header-black { background-color: #000; padding: 15px 0; text-align: center; width: 100%; border-bottom: 2px solid #b39359; }
    .header-black img { width: 80px; height: auto; }
    
    .main-wrapper { width: 95%; max-width: 380px; background: white; margin: 10px; border: 1px solid #e0d0b0; border-radius: 12px; overflow: hidden; }
    .content-padding { padding: 12px; }

    /* أزرار اختيار الأسبوع */
    .week-nav { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
    .week-btn { width: 100%; padding: 10px; border: 1px solid #b39359; background: #fff; color: #b39359; font-size: 12px; font-weight: 700; cursor: pointer; border-radius: 8px; text-transform: uppercase; transition: 0.3s; }
    .week-btn.active { background: #b39359; color: #fff; }

    .week-content { display: none; }
    .week-content.active { display: block; }

    .day-section { margin-bottom: 18px; }
    .day-title { font-size: 11px; font-weight: 700; color: #000; background: #fdf7eb; padding: 5px 10px; border-left: 3px solid #b39359; margin-bottom: 8px; border-radius: 4px; display: flex; justify-content: space-between; }
    
    .slots-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .slot { padding: 6px 0; text-align: center; border: 1px solid #e0d0b0; border-radius: 5px; font-size: 9px; color: #b39359; font-weight: 600; background: #fff; }

    /* إخفاء المواعيد المحجوزة تماماً */
    .booked { display: none !important; }

    .footer-note { text-align: center; font-size: 9px; color: #999; margin-top: 15px; border-top: 1px dashed #e0d0b0; padding-top: 10px; }
    .back-btn { display: block; text-align: center; margin-top: 10px; padding: 10px; background-color: #000; color: #b39359; text-decoration: none; border-radius: 8px; font-size: 11px; font-weight: 600; }
</style>
</head>
<body>
<div class="main-wrapper">
    <div class="header-black"><img src="Curls_by_Carine_Logo_Transparent.png" alt="Logo"></div>
    
    <div class="content-padding">
        <!-- أزرار اختيار الأسبوع -->
        <div class="week-nav">
            <button class="week-btn active" onclick="openWeek('current-week', this)">✨ This Week Availability</button>
            <button class="week-btn" onclick="openWeek('next-week', this)">📅 Next Week Availability</button>
        </div>

        <!-- الأسبوع الحالي -->
        <div id="current-week" class="week-content active">
            <div class="day-section">
                <div class="day-title">Friday <span>May 8</span></div>
                <div class="slots-container">
                    <div class="slot">09:00A</div>
                    <div class="slot">09:30A</div>
                    <div class="slot booked">10:00A</div> <!-- محجوز: لن يظهر -->
                    <div class="slot">10:30A</div>
                    <div class="slot">11:00A</div>
                    <div class="slot booked">11:30A</div> <!-- محجوز: لن يظهر -->
                    <div class="slot">12:00P</div>
                </div>
            </div>
            <!-- يمكنك إضافة باقي الأيام هنا -->
        </div>

        <!-- الأسبوع القادم -->
        <div id="next-week" class="week-content">
            <div class="day-section">
                <div class="day-title">Friday <span>May 15</span></div>
                <div class="slots-container">
                    <div class="slot">09:00A</div>
                    <div class="slot">09:30A</div>
                    <div class="slot">10:00A</div>
                </div>
            </div>
        </div>

        <div class="footer-note">Only available slots are shown.</div>
        <a href="index.html" class="back-btn">⬅ Back to Services</a>
    </div>
</div>

<script>
    function openWeek(weekId, btn) {
        // إخفاء المحتوى غير المختار
        var contents = document.getElementsByClassName("week-content");
        for (var i = 0; i < contents.length; i++) {
            contents[i].classList.remove("active");
        }
        // إزالة التحديد من الأزرار
        var buttons = document.getElementsByClassName("week-btn");
        for (var i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove("active");
        }
        // إظهار المختار
        document.getElementById(weekId).classList.add("active");
        btn.classList.add("active");
    }
</script>
</body>
</html>
